<style>
  :root{
    --navy1:#0E2538; --navy2:#081824; --steel:#7FB2D9; --steel-dk:#2E6188;
    --ink:#EAF1F7; --muted:#9FB6C9; --white:#F3F7FB; --line:#24405A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); min-height:100vh;
    background:linear-gradient(180deg,var(--navy1),var(--navy2));
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    padding:32px 20px 48px;
  }
  .wrap{max-width:680px;margin:0 auto}
  header{text-align:center;margin-bottom:26px}
  .anchor{width:34px;height:40px;display:block;margin:0 auto 12px}
  .anchor path,.anchor circle,.anchor line{stroke:var(--steel);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  h1{font-weight:800;font-size:clamp(30px,7vw,46px);letter-spacing:-.5px;margin:0 0 6px;color:var(--white)}
  .title{font-weight:600;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--steel);margin:0}
  .lic{margin-top:12px;font-size:13px;color:var(--muted)}
  .paper{
    display:block;margin:26px auto 0;max-width:600px;border-radius:12px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);border:1px solid rgba(127,178,217,.18);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .paper:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .paper img{display:block;width:100%;height:auto}
  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .btn{
    appearance:none;border:0;cursor:pointer;text-decoration:none;
    font-family:inherit;font-weight:600;font-size:15px;letter-spacing:.2px;
    padding:14px 22px;border-radius:10px;display:inline-flex;align-items:center;gap:9px;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--steel);color:#0A1D2C}
  .btn-primary:hover{background:#93c1e2}
  .btn-ghost{background:transparent;color:var(--steel);border:1.5px solid rgba(127,178,217,.55)}
  .btn-ghost:hover{border-color:var(--steel);background:rgba(127,178,217,.08)}
  .btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  footer{text-align:center;margin-top:30px;font-size:13px;color:var(--muted)}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid rgba(159,182,201,.35)}
  .dot{opacity:.5;margin:0 8px}
  :focus-visible{outline:2px solid var(--steel);outline-offset:3px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
